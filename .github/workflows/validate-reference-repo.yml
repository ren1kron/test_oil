name: Validate reference repository

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install application and test dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.lock

      - name: Run static integrity checks
        shell: bash
        run: |
          set -o pipefail
          python tools/validate_reference_repo.py --participant 2>&1 | tee validation.log

      - name: Test calculation engine, optimization, exports and UI
        run: python -m pytest -q

      - name: Upload validator log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reference-repo-validation-log
          path: validation.log
          if-no-files-found: warn
