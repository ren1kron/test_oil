[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "fuel-planner"
version = "1.1.0"
description = "Orbital fuel supply planning, simulation and optimization"
requires-python = ">=3.12"
dependencies = [
  "streamlit>=1.40,<2", "pandas>=2.2,<3", "plotly>=5.24,<7",
  "pydantic>=2.10,<3", "scipy>=1.14,<2", "openpyxl>=3.1,<4",
  "pyyaml>=6,<7", "jsonschema>=4.23,<5"
]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.scripts]
fuel-planner = "fuel_planner.cli:main"

[tool.setuptools.packages.find]
include = ["fuel_planner*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
